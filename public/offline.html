  <title>Hors connexion · غير متصل</title>
  <style>

    .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(135deg,#e0112b,#7d0a1c)}

    <div class="logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="#fff"><path d="M13.2 2.5 5 13.2c-.4.5 0 1.3.7 1.3h4.6l-1 7c-.1.8.9 1.2 1.4.6L19 10.8c.4-.5 0-1.3-.7-1.3h-4.5l.9-6.2c.1-.8-.9-1.2-1.5-.8Z"/></svg></div>
